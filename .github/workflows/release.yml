name: Release

# Publishing happens from CI, not from a laptop: npm provenance needs the
# runner's OIDC identity, and it means the gate has demonstrably passed on the
# exact commit being published. Tag a release to publish it:
#   npm version patch && git push --follow-tags
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write        # required for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci --ignore-scripts

      # Refuse to publish a tag whose version does not match package.json —
      # otherwise the tag and the registry disagree forever.
      - name: Tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          test "$tag" = "$pkg" || { echo "tag $tag != package.json $pkg"; exit 1; }

      - name: Gate
        run: node --check index.js && node scripts/smoke.mjs && node scripts/hygiene.mjs
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
