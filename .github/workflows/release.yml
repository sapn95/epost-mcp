# Publishing uses npm Trusted Publishing (OIDC): the runner proves its identity
# to the registry and gets a short-lived, signed token per publish. There is no
# npm token anywhere — nothing to store, rotate, or leak. npm itself recommends
# this over an automation token, because a "bypass 2FA" token is a standing key
# to every package it covers.
#
# Configure once per package on npmjs.com → Settings → Trusted Publisher:
#   Organization or user: sapn95
#   Repository:           <this repo>
#   Workflow filename:    release.yml
#   Allowed actions:      npm publish
#
# Then release with:  npm version patch && git push --follow-tags
#
# Shape and conventions: https://github.com/sapn95/.github/blob/main/CI.md
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default. The one job that needs to write says so itself.
permissions:
  contents: read

concurrency:
  # Never cancel a release in progress: a run stopped between publishing to the
  # registry and creating the GitHub Release leaves a version nobody can find.
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  guard:
    name: the tag agrees with package.json
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # A tag and a published version that disagree can never be reconciled:
      # npm will not let the version be republished, and the tag cannot be
      # moved once anyone has fetched it.
      - name: compare
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          test "$tag" = "$pkg" || { echo "tag $tag != package.json $pkg"; exit 1; }

  publish:
    name: publish to npm
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write # to publish the GitHub Release for the tag
      id-token: write # lets the runner mint the OIDC token npm verifies
    steps:
      - uses: actions/checkout@v7
        with:
          # The release notes below start at the previous tag, and `git
          # describe` cannot find one in a shallow clone — which is why that
          # command has always fallen through to its own fallback.
          fetch-depth: 0
          # Nothing pushes with git here: the release is created through gh
          # with the job token, and npm publish authenticates over OIDC.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs Node >= 22.14; this is simply the current
          # release, which is comfortably past that.
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm

      # Trusted publishing needs npm >= 11.5.1; the bundled npm may be older.
      - name: a recent enough npm
        run: |
          npm install -g npm@latest
          npm --version

      - run: npm ci --ignore-scripts

      - name: chromium, for the browser half of the suite
        run: npx playwright install --with-deps chromium

      # The same gate CI runs, run once more against the tagged commit. A
      # publish cannot be taken back, so this is the one place where repeating
      # a check that already passed on main is worth the two minutes.
      - name: the gate, being lint, smoke, hygiene and tests with a floor
        run: npm run gate

      - name: publish
        run: npm publish

      # A tag alone is invisible on the repo page: GitHub only shows a Release.
      # Create one from the tag so the published version is discoverable from
      # GitHub as well as from the registry.
      - name: github release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --latest \
            --notes-start-tag "$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || echo '')" \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --latest
          name="$(node -p 'require("./package.json").name')"
          echo "https://www.npmjs.com/package/$name/v/$version" >> "$GITHUB_STEP_SUMMARY"
